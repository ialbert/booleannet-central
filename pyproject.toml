[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "booleannet"
version = "2.0.3"
description = "Boolean network modeling"
readme = "README.md"
authors = [{ name = "Istvan Albert", email = "istvan.albert@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5,<9",
    "networkx",
    "numpy",
    "ply",
    "pygraphviz",
    "pydot",
]

[project.urls]
Homepage = "https://github.com/ialbert/booleannet"

[project.scripts]
bnet = "booleannet.cli:main"

[tool.setuptools.packages.find]
include = ["booleannet*"]

[tool.setuptools.package-data]
booleannet = ["data/*.json.gz"]
